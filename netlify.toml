[build]
  # Static site - no build command needed
  publish = "."

# Rewrite rules for clean URLs (removing .html)
[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

# Redirect rules for other .html files
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = false

# Handle root
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

