[build]
  # Astro static build (see astro.config.mjs). public/ is copied into dist/ as-is.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Security headers for every page (added after the 2026-11-06 site audit flagged 5 missing).
# HSTS is already sent by Netlify. The CSP allowlist matches what the site really loads:
#  - Google tag (GA4 + Google Ads): script, beacons, and the Ads conversion iframe, per
#    Google's published CSP guidance for gtag.js.
#  - contract.html: signature_pad (jsDelivr), EmailJS (jsDelivr script, api.emailjs.com
#    calls) and html2pdf (cdnjs), which draws through canvas, data: and blob: URLs.
#  - 'unsafe-inline' scripts and styles: Astro inlines the theme, reveal and gtag scripts
#    and the legacy tools use inline handlers and style attributes. The policy still
#    blocks scripts from any other host, plugins, <base> hijacks, off-site form posts
#    and framing by other sites.
# When adding a third-party script, add its host here or it will be blocked.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googletagmanager.com https://www.googleadservices.com https://www.google.com https://googleads.g.doubleclick.net https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.doubleclick.net https://*.google.com https://pagead2.googlesyndication.com https://www.googleadservices.com https://api.emailjs.com; frame-src https://td.doubleclick.net https://www.googletagmanager.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"

# Private client tools: always fetch fresh (replaces the old in-page cache-busting
# script) and keep them out of search engines even if a link leaks.
[[headers]]
  for = "/intake*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/contract*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/audit-results*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex, nofollow"

# llms.txt is plain Markdown for AI tools; say so explicitly (UTF-8 for the quotes).
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Long-cache Astro's fingerprinted assets (file names change when content changes).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Rewrite rules for clean URLs (removing .html)
# Specific rule for thank-you page - serves content at clean URL
[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

# Intake form thank-you page
[[redirects]]
  from = "/intake-thank-you"
  to = "/intake-thank-you.html"
  status = 200

# Redirect /thank-you.html to clean URL (if accessed directly)
[[redirects]]
  from = "/thank-you.html"
  to = "/thank-you"
  status = 301
  force = true

# Redirect /intake-thank-you.html to clean URL (if accessed directly)
[[redirects]]
  from = "/intake-thank-you.html"
  to = "/intake-thank-you"
  status = 301
  force = true

# Redirect rules for other .html files
# Note: thank-you.html is handled above with force: true, so it won't match this rule
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = false

# Handle root
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200


# Browsers ask for /favicon.ico even though every page links the SVG icon; answer with it
# instead of a 404 (seen on /intake and /contract in the 2026-09-28 walkthrough).
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 200
